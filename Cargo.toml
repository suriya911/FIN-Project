[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/reference",
    "crates/sim",
    "crates/shell",
    "crates/tests",
]
# The fuzz package is its own workspace: cargo-fuzz injects sanitizer
# flags and custom profiles that must not leak into the main build.
exclude = ["crates/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
debug = true # keep symbols for perf/flamegraph

[profile.bench]
lto = true
codegen-units = 1
debug = true
